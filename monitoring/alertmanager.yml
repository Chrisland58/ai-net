global:
  resolve_timeout: 5m

# ── Routing tree ──────────────────────────────────────────────────────────────
route:
  group_by: ["alertname"]
  group_wait: 5m
  group_interval: 5m
  repeat_interval: 4h
  receiver: "slack-ops"

  routes:
    # critical severity → PagerDuty
    - matchers:
        - severity = "critical"
      receiver: "pagerduty"
      group_by: ["alertname"]
      group_wait: 5m
      repeat_interval: 4h

    # warning severity → Slack #ops
    - matchers:
        - severity = "warning"
      receiver: "slack-ops"
      group_by: ["alertname"]
      group_wait: 5m
      repeat_interval: 4h

# ── Inhibit rules ─────────────────────────────────────────────────────────────
# When AllAgentsOffline is firing, suppress TaskQueueDepthHigh — the queue
# backs up because agents are down, not because of an independent capacity issue.
inhibit_rules:
  - source_matchers:
      - alertname = "AllAgentsOffline"
    target_matchers:
      - alertname = "TaskQueueDepthHigh"
    equal: []

# ── Receivers ─────────────────────────────────────────────────────────────────
receivers:
  - name: "pagerduty"
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: "{{ .GroupLabels.severity }}"
        description: "{{ range .Alerts }}{{ .Annotations.summary }} {{ end }}"
        details:
          runbook: "{{ (index .Alerts 0).Annotations.runbook_url }}"

  - name: "slack-ops"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#incidents"
        send_resolved: true
        title: "[{{ .Status | toUpper }}{{ if eq .Status \"firing\" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
